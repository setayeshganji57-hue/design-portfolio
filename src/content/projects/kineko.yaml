blocks:
  - type: text
    heading: The poster
    body: |
      The A4 poster gives the character the whole page, on a warm off-white ground. The festival's logotype and Japanese name sit above it, and the festival details are set in a quiet column to the right, so the figure carries the poster on its own.
  - type: image
    media: { file: kineko/poster.jpg, alt: "A4 poster with the 3D camera character, the KINEKO logotype above and festival details on the right" }
  - type: text
    heading: A character made of cinema
    body: |
      Every part of the character comes from film or from play: the reels, the projector grille, the megaphone, the cables of a lighting rig, a slide-like staircase and a door. Seen on blue, on white, against a triangle of red light or on a stand, it keeps the same personality.
  - type: grid
    columns: 4
    items:
      - { file: kineko/character-blue.jpg, alt: The 3D camera character on a blue background }
      - { file: kineko/character-variations.jpg, alt: Four renders of the character on blue and white backgrounds }
      - { file: kineko/character-triangle.jpg, alt: A simplified 3D version of the character against a red triangle }
      - { file: kineko/character-studio.jpg, alt: The character as a model on a stand in a studio }
  - type: text
    heading: Modelling in Cinema 4D
    body: |
      The character was built piece by piece in Cinema 4D, from grey forms to a library of parts and materials: reels, rings, buttons, cables, grilles and stairs, each with its own colour and finish.
  - type: pair
    items:
      - { file: kineko/modelling.jpg, alt: Grey modelling stages of the character in Cinema 4D }
      - { file: kineko/parts-and-materials.jpg, alt: Sheet of the character's parts, materials and colours }
  - type: text
    heading: A flat graphic language
    body: |
      Drawn in Illustrator, the same character becomes a set of simple shapes: circles for reels and numbers, a triangle for the light of the projector, bars for cables. The shapes work as clean vector graphics, as crayon-textured drawings that feel close to a child's hand, and as patterns and long banners that carry the festival's logotype and partners.
  - type: grid
    columns: 4
    items:
      - { file: kineko/flat-character.jpg, alt: Flat vector version of the character with reel eyes and a smile }
      - { file: kineko/flat-camera.jpg, alt: Flat vector camera made of circles and triangles }
      - { file: kineko/flat-column.jpg, alt: Tall flat version of the character as a column }
      - { file: kineko/mark-38.jpg, alt: The number mark built from yellow circles on blue }
      - { file: kineko/crayon-1.jpg, alt: Crayon-textured drawing of the character on blue and red }
      - { file: kineko/crayon-2.jpg, alt: Second crayon-textured drawing of the character }
      - { file: kineko/pattern.jpg, alt: Pattern of the identity's shapes in yellow, blue, red and green }
      - { file: kineko/banner-artwork.jpg, alt: Banner artwork with the festival logotype, the character's parts and partner logos }
  - type: text
    heading: Across the festival
    body: |
      Mockups show how the identity could live across the festival: the character as a statue in a cinema foyer, lightboxes, outdoor seating built from its parts, and hanging banners and scaffold graphics that turn the venue into part of the identity.
  - type: grid
    columns: 4
