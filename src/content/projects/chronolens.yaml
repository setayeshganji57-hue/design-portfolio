  - type: text
    heading: Building Rome
    body: |
      Every building follows the same path: read the history, model it exactly, then let the story change it. The Pantheon goes from an 18th-century engraving to a model in Rhinoceros 3D, then to weathered materials and a scene in Unreal Engine under snow. Details go down to the letters of the frieze, M·AGRIPPA·L·F·COS·TERTIVM·FECIT, modelled rather than painted on, and around it a district of palazzi, a fountain and everyday props makes the streets believable.
  - type: pair
    tiles: wide
    items:
      - { file: chronolens/board-10-details.jpg, alt: "Details board: the portico, bell towers and the inscription on the frieze" }
      - { file: chronolens/board-11-the-city.jpg, alt: "The city board: palazzi, the fountain, props and the full level from above" }
  - type: text
    heading: Play
    body: |
      The time jump is told through weather: the story opens in midsummer heat and wakes in a winter that Rome almost never sees. The soundscape stays deliberately bare, with no music, so silence keeps attention on the story. A tutorial level teaches every control in one walk along the route, the trailer was storyboarded shot by shot in the engine, and every menu sits on a blurred, sepia view of the city, like an old photograph laid over the game.
