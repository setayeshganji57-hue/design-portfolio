title: Social Cafe — A logo drawn from the table
status: published
categories: [brand-identity]
order: 12
tags: [Brand identity, Bilingual logotype, Packaging, Café]
year: 2021
context: { type: commissioned, institution: Social Cafe }
location: "Tehran, Iran"
audience: "Café-goers in Tehran, including strangers who come to share the long table"
summary: Identity for Social Cafe in Tehran, a café built around one long communal table, with a logo drawn from the table and chairs seen from above.
overview: |
  Social Cafe opened in Tehran in 2021 and is still open today. Its name is its idea: a place where people sit together. The heart of the space is a long, rounded table in lacquered blue, where strangers share one surface with orange chairs gathered around it.

  Instead of inventing a symbol, the logo takes the furniture itself. Seen from above, the table becomes a stadium shape, the chair backs become half circles, three on each side, and six small rings mark one place for each guest: a table that is already full, a small picture of being social. The Persian name, کافه سوشال, and the Latin SOCIAL CAFE are drawn as one pair on the same grid, with heavy, rounded strokes the same thickness as the table edge; in the Persian line, the long stroke between the words stretches like the tabletop itself.

  The colours are taken from the room: table blue, chair terracotta, cup cream and plaster stone. From the same few shapes come a pattern of chair backs, a set of menu icons, round seals, menus and price tags, cups, bags, coffee packaging, cards, signage and uniforms.
role: Logo and symbol, Persian and Latin logotype, colour, pattern, icons, stickers, menus, packaging, stationery, signage and uniforms
