blocks:
  - type: text
    heading: A café built around one long table
    body: |
      The table and chairs were designed for the café, and the identity was designed alongside them, so the brand on a cup, a bag or a sign is the same thing guests sit at. The mark uses only two shapes, both taken from the furniture: a rectangle closed by two half circles for the table, and half circles for the chair backs. Everything sits on one grid, with the chairs spaced at the same rhythm as the seats, and the heavy, rounded forms keep the friendliness of real, sat-on furniture rather than a sharp corporate symbol.
