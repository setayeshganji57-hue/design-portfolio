title: Sunny Days Between Cubes
status: published
categories: [motion-film]
order: 10
tags: [Film, Motion, Projection]
year: 2023
context: { type: academic, institution: Sapienza University of Rome, course: Performing Arts and New Media Studio }
summary: A movement-based project in the centre of Sapienza University, translating choreographic scores into video.
overview: |
  Choreography has changed over time, and today its movements can be recorded as scores and then translated into other forms of art. This project is based on movement in the Sapienza University area, using the basic concepts of chronography.

  The outcome is a 4D video, created in Cinema 4D, which could not be shown in a printed portfolio. The video is projected in the centre of the university, on the same tables where the scores were made, with LED lights and a projector. The projection recalls the activity and movement of students, and draws the attention of visitors at night.
