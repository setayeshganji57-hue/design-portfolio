  - type: text
    heading: Design approach
    body: |
      The project explores how history, architecture, and interactive storytelling can come together to create a compelling game environment.

      Historical and visual research informed the development of Rome's urban setting and its architectural landmarks. These references were translated into 3D environments and rendered scenes, including a transformed winter city and a dramatic depiction of the Pantheon in flames.

      Photography serves as the central narrative device, connecting the protagonist's journey to the act of gathering evidence and uncovering hidden stories. The contrast between a familiar summer landscape and an unsettling winter world reinforces the game's atmosphere and sense of temporal disorientation.

      The result is a concept that approaches cultural heritage through exploration and mystery, encouraging players to engage with history by investigating the environment rather than simply observing it.
