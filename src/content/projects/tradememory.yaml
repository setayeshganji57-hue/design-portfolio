blocks:
- type: text
  heading: One trade, two halves
  body: |
    The symbol is one capsule drawn twice. A bar with a rounded end holds two overlapping discs, and the second capsule is the first turned 180 degrees around the point where they meet: two halves of one trade, the trade and its review, locked on a single line. A gradient from solid navy to white is the memory, fading in one direction on a white page and the other on navy.

    The palette is lifted straight from the symbol. Ledger Navy carries the record, Signal Sky marks what is being looked at, and Paper is the page the numbers sit on. Profit and loss colours stay out of the brand, so the identity never takes sides on a result. Every text pairing is checked against WCAG contrast. Inter runs the whole product with tabular figures, so every number holds its column, and a weight shift, Trade in 600 and Memory in 400, gives the name a wordmark without a second typeface.
- type: pair
  tiles: wide
  items:
  - { file: tradememory/board-01-logo-construction.jpg, alt: "Logo construction: the capsule, its half-ellipse end, the two discs and the 180-degree rotation, with measurements" }
  - { file: tradememory/board-03-colour.jpg, alt: "Colour board: Ledger Navy, Signal Sky and Paper, the symbol's gradients and WCAG contrast pairings" }
- type: image
  media: { file: tradememory/board-04-typography.jpg, alt: "Typography and UI tokens: Inter, the shipped dark-theme tokens and the wordmark" }
- type: text
  heading: From statement to self-knowledge
  body: |
    The product is mapped as twenty-four routes in three layers: access, an import gate, and the account workspace with its seven-item navigation. Nothing reaches the workspace until a statement has passed reconciliation, so trust before insight is built into the route map, not just the copy. A line on every screen states that the analysis is historical, not trading signals or financial advice.
- type: image
  media: { file: tradememory/board-05-information-architecture.jpg, alt: "Information architecture: twenty-four routes in three layers, from access to import to the account workspace" }
