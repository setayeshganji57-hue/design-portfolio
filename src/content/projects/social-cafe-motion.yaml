  - type: text
    heading: From furniture to motion
    body: |
      The mark uses only two shapes, both taken from the furniture: the table, a rectangle closed by two half circles, and the chair back, a half circle. Repeated, the chair backs become a pattern of seats pushed in and pulled out, like a busy café seen from the ceiling; where two half circles meet they close into a full circle, two people sitting face to face. In motion, those same parts can gather, turn and settle into the logo.
