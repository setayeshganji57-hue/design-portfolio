blocks:
  - type: text
    heading: Extrusion and light
    body: |
      For the MEF Leadership Forum in Rome, on 9 May 2023 at The First Musica, the name moves forward: the three letters "mef" are pulled into long, fading three-dimensional shadows across a flat blue field, as if they were travelling across the poster. For "No, Neon No Cry" at MAMbo's Project Room, from 12 May to 23 October 2022, the title is neon without the tube, drawn as a single glowing hand-drawn line on deep red, so the poster feels lit from inside.
  - type: pair
    tiles: wide
    items:
      - { file: poster-collection/board-03-mef.jpg, alt: "MEF Leadership Forum board: the poster on a billboard and a street panel, with its palette" }
      - { file: poster-collection/board-04-no-neon.jpg, alt: "No, Neon No Cry board: the framed poster on a chair and a plinth, with its palette" }
  - type: text
    heading: Texture and balance
    body: |
      The call for entries for a 2022 typography competition sets its title above a marbled swirl of teal, grey and charcoal, cut through by rounded bars that carry the information at a right angle, so you have to turn your head to read it: the poster asks for the same attention a typographer gives letters. For the Media Architecture Biennale, from 28 June to 2 July 2021, architecture becomes a balancing act: a circle, two half-circles and three arches stacked into a figure that could be a building, a person or a sculpture.
  - type: pair
    tiles: wide
    items:
      - { file: poster-collection/board-05-typography.jpg, alt: "Typography Competition board: the framed poster by curtains and on a bench, with its palette" }
      - { file: poster-collection/board-06-mab.jpg, alt: "Media Architecture Biennale board: the poster on a concrete wall and a billboard, with its palette" }
  - type: text
    heading: One system, three artists
    body: |
      Three exhibition posters for The Dubai Mall, from September 2022, share one drawing: horizontal bands that start thin at the top and thicken towards the bottom, bending around four solid circles of different sizes, like weights pressing into a soft surface. Layout, lines, circles and title block stay the same; only the artist's name and one colour change, blue for Kandinsky, ochre for Gaudí and green for Klee. Even the bullet between "September" and "2022" is a small copy of the circles.
  - type: pair
    tiles: wide
    items:
      - { file: poster-collection/board-07-dubai-system.jpg, alt: "One system, three artists board: the three posters pasted on a wall" }
      - { file: poster-collection/board-08-dubai-three.jpg, alt: "The three posters side by side: Kandinsky in blue, Gaud\u00ed in ochre, Klee in green" }
  - type: image
    media: { file: poster-collection/board-09-lines-with-weight.jpg, alt: "Lines with weight board: the Kandinsky poster and how the system works" }
  - type: text
    heading: Type that does more than inform
    body: |
      Extrusion, light, texture, balance and system: five ideas, one for each brief.
  - type: image
    media: { file: poster-collection/board-10-overview.jpg, alt: "Overview board: the five posters, one idea each" }
