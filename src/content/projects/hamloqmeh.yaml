blocks:
  - type: text
    heading: Website
    body: |
      The website introduces the platform in Persian, using right-to-left layouts. It explains how the service works, with separate sections for customers and for food businesses. During the trial stage, visitors can join a waiting list.
  - type: pair
    align: start
    caption: The website and the app's log-in screen on a phone.
