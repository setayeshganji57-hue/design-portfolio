- type: text
  heading: Map and spot details
  body: |
    The map is the home screen. Parking areas appear as numbered markers, coloured by availability, with browsable parking cards along the bottom.

    Selecting a marker opens a panel with spot-by-spot availability, the hourly price, the distance, and a Navigate button. The same panel adapts its colour to the three states: available, filling up, and almost full.
