summary: A vertical motion film for Social Cafe in Tehran, animating the identity drawn from the café's long communal table.
overview: |
  Motion work for Social Cafe, a café in Tehran built around one long communal table, whose identity I also designed. The logo is the table itself seen from above: a rounded stadium shape, six half-circle chair backs and six small rings, one place for each guest.

  The film sets that furniture in motion, in the identity's table blue, chair terracotta and cup cream, in a vertical 9:16 format for the café's social media. Because every part of the brand is built from the same two shapes, the table and the chair back, the motion needs no new language: the logo, the pattern of chairs and the café's lines are all made from pieces that can move.
role: Motion design and animation, based on the brand identity I designed
