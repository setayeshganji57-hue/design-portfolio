blocks:
  - type: text
    heading: A history lesson disguised as a crime
    body: |
      Nerezza, a history student, takes a photograph with an old camera and wakes up in a distorted, snow-covered Rome. To get home she must solve a photographer's murder, and every clue sends her through real streets, real buildings and real history, with the Pantheon at the centre of it all. The story is written as a detective story so the history is never a lecture: every place the player must visit is a place worth knowing.

      A narrative action-adventure for PC, aimed at players from middle school to university and at fans of story-led, atmospheric games, with subtitles for all dialogue and captions for sound effects.

      Created with Farnaz Attar, under the guidance of Prof. Tommaso Empler and Prof. Lauren Ferro at Sapienza University of Rome.
