summary: Lesson materials I designed as a teaching assistant for Sapienza's Multimedia Design Studio, introducing students to the preproduction of motion projects.
overview: |
  I was invited to Sapienza University of Rome as a teaching assistant in the Multimedia Design Studio, led by Prof. Vincenzo Maselli, to teach parts of the motion design programme. For each lesson I designed the teaching materials.

  This lesson, given on 11 April 2022, takes students through preproduction: the steps that turn an idea into a plan before any animation is made. It moves from concept development, mood boards and script to visual style, storyboarding and design boards, and gives students a shared vocabulary for framing a moving image.
role: Teaching assistant. Lesson structure and slide design.
