  - type: text
    heading: How I built it
    body: |
      I modelled every building in the game myself, from start to finish, in Rhinoceros 3D and CAD: the Pantheon and the city around it.

      I then imported the buildings into Unreal Engine and built the game environment there. The characters are Unreal Engine mannequins, which I chose and set up in the engine.

      I did all the coding in Unreal Engine, building the gameplay from the story we had written.
  - type: text
    heading: Researching a square kilometre of Rome
    body: |
      The game is set in the Campus Martius, around the Pantheon. Before modelling anything, the area was mapped twice, on an atlas of ancient Rome and on today's streets, to fix which buildings the player would meet and where. Each landmark on the route was compared across time, the 18th- and 19th-century view against the street today, to decide what the game's Rome should look like: old enough to feel strange, familiar enough to recognise.
