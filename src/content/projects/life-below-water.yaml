summary: A 4 × 1 metre illustrated ocean map combining storytelling, four learning stages, and robotic play.
overview: 'Life Below Water is an educational game concept that invites children to explore the ocean through storytelling,
  illustration, and hands-on play. Designed around a 4 × 1 metre illustrated map and a Sphero robotic ball, the
  experience takes players from a sunny shoreline into deeper underwater environments, connecting discoveries about
  marine life with lessons about pollution and recycling.


  I developed the map’s visual world, creating the marine characters, environmental illustrations, and layouts across
  four connected stages. The design challenge was to translate a substantial educational programme into a journey
  children could understand and want to explore. Characters, activity markers, and a colour palette that shifts
  from warm yellow to deep blue and violet give each stage its own identity while holding the experience together.'
