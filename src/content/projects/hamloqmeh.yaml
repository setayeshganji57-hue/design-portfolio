summary: A food-saving platform connecting consumers and food businesses in Iran.
overview: 'Hamloqmeh is a food-saving platform to connect people with bakeries, restaurants, and supermarkets offering surplus food at reduced prices. The idea brings together two everyday needs: helping businesses reduce food waste and making good food more affordable.


  For its marketing website, I worked from the initial concept through the interface design, shaping how the platform introduces itself to both customers and potential business partners. The design challenge was to communicate an unfamiliar service clearly: what Hamloqmeh offers, how it works, and why someone would want to take part.


  The website is designed for a Persian-speaking audience, with a right-to-left layout and an emphasis on readable typography, clear information hierarchy, and a welcoming visual identity. Its purpose at this early stage is to introduce the service and encourage customers and businesses to join the waitlist.


  Project stage: Early-stage startup. The website supports awareness and waitlist registration ahead of wider product testing.'
role: Concept development, website structure, visual direction, and UI design
