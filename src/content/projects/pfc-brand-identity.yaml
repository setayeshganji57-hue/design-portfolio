summary: Logo, corporate stationery, website wireframes, UI design, and illustrations for a CNC cutting and fabrication
  company.
overview: 'Pars Foam Cut specialises in CNC cutting, large-scale modelling, and fabrication, turning digital designs
  into physical forms for industrial, architectural, and advertising applications. In 2022, I worked across its
  brand identity and digital presence, designing the logo, corporate stationery, website wireframes, interface,
  and illustrations.


  The identity combines a geometric symbol with a Persian logotype and a restrained palette of reddish brown, grey-green,
  and cream. I extended this visual language across corporate stationery, creating a consistent presentation across
  printed materials.


  For the website, I worked on the structure and interface, organising information about the company’s services
  and capabilities. I also created a coordinated collection of illustrations combining industrial scenes, human
  characters, and simplified symbols, bringing a more approachable character to its technical subject matter.


  The project brings together identity design, print applications, interface design, and illustration around a shared
  visual language.'
role: Logo and visual identity design, corporate stationery, website wireframing, UI design, and website illustrations.
