  - type: text
    heading: Interface design
    body: |
      The menus share one visual system: a warm sepia veil over blurred scenes from the game, the ChronoLens logotype, thin underlined headings, and soft pill-shaped buttons. The look recalls an old photograph, which ties the interface to the camera at the centre of the story.

      The controls screen shows each key as a keycap grouped into movement and actions, so players can read the layout at a glance. Settings are split into controls, audio, and general options, and the story screen introduces the premise before play begins.
