summary: Two vertical motion films for Soundscape of Iran, a sound exhibition in Tehran, animating the poster's machine of pipes, gears, chains and horns.
overview: |
  Two motion films for Soundscape of Iran (صحنهٔ صدای ایران), a sound exhibition held at the Karestan Building in Tehran from 10 January to 7 February 2025, supported by Divar. For the exhibition I designed a poster built like a sound machine: the Persian title lettered out of pipes, horns, cables and gears, so the words read as an apparatus that sound could travel through.

  The films take that idea literally. Sound can't be printed, but it can move, so the same machine is set going: the parts of the identity, drawn in one isometric line on red and kraft, are animated as a working mechanism. Made in a vertical 9:16 format for the exhibition's social media, the films run 55 and 36 seconds.
role: Motion design and animation, based on the poster and identity I designed
