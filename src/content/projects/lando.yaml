title: Lando Pastry — A pastry shop that speaks two languages
status: published
categories: [brand-identity]
order: 9
tags: [Brand identity, Packaging, Bilingual typography, Pastry shop]
year: May 2024
context: { type: commissioned, institution: Lando Pastry }
location: "Tehran, Iran"
audience: "Customers of a neighbourhood pastry shop in Tehran, at the counter and on Instagram"
summary: Bilingual identity for Lando, a pastry shop in Tehran, drawn from one rounded line, from the logo and monogram to cookie icons, patterns, boxes and the Instagram opening.
overview: |
  Lando (لاندو) is a pastry shop in Tehran. It needed an identity that feels warm and a little playful. It also had to work as well in Persian as in English, and on everything a pastry shop hands over the counter.

  Everything comes from one rounded line, with an even stroke and soft ends. That line draws the name in both Latin and Persian, so neither version reads as a translation of the other. The same line forms an L inside a speech bubble, a monogram for a shop that greets you before you walk in. It also draws six biscuit shapes: arranged in a circle they make an emblem, and repeated they make nine patterns.

  The palette is soft pink and mint, held together by a deep slate. Pink and mint swap between background and accent from one piece to the next, so a stack of boxes reads as one family. The identity runs across a family of pastry boxes, paper bags, bread wraps, a macaron box, stickers, gift tags, a rubber stamp, and the Instagram posts that announced the opening, including the invitation itself.
role: Logo and Persian/English lettering, monogram, colour, icon set and emblem, patterns, packaging, print pieces, social media
