- type: text
  heading: A story that gives learning a purpose
  body: 'The adventure begins with a shell asking for help: its underwater home is threatened by pollution. Children
    become ocean defenders, following a route through the map and completing activities to progress. The proposed
    experience combines movement of the Sphero robot with QR-triggered content, teacher guidance, stories, puzzles,
    drawing, and questions. Each interaction connects the illustrated environment to a learning task.'
