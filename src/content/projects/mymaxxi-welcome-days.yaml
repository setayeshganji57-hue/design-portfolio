summary: A visual identity and campaign for myMAXXI card holders, celebrating two days of events and offers.
overview: |
  A campaign for the MAXXI museum in Rome, informing the public about myMAXXI and the advantages reserved for card holders. The brief asked for the myMAXXI Welcome Days to be presented as two days of celebration, with discounts and dedicated events.

  The tone of voice is engaging, cheerful, warm and contemporary. The four colours of the four card types were used to build the palette.

  The design uses two "X" symbols and one "I" symbol, drawn from the MAXXI identity. They make the message clearer when read with the slogan "Manchi tu, per essere al completo" (You are needed here to be complete).
