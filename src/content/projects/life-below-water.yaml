  heading: An interconnected visual learning experience
  body: 'The project brings together a large-format map, four lesson boards, four activity sheets, an original collection
    of illustrated characters and objects, and storyboards explaining the proposed interactions. Illustration serves
    both an expressive and a practical purpose: it introduces characters, guides attention, and makes environmental
    topics approachable for young learners.'
