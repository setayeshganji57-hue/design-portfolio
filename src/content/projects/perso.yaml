  - type: text
    heading: Outcome
    body: |
      The project resulted in a playable game, with a trailer and a tutorial film that introduces the game and how to play it.

      PERSO brings together historical investigation, architectural modelling, narrative design, and real-time environment development to explore how a historically grounded urban setting can become an interactive story.
