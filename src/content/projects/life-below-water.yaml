summary: An educational, playful map that teaches children about ocean life and pollution.
overview: |
  An educational map for children aged 7 to 10, designed to explain ocean ecology and why the sea should not be polluted. The path is laid out with a small robotic sphere, and the child moves through different phases of the map, learning the subject while playing through games and challenges.

  Each lesson takes place at a different depth of the ocean, with its own characters and objects. The protagonist is a child playing as a diver.
