  - type: text
    heading: Project scope
    body: |
      Game concept and narrative design: the story premise, protagonist, objectives, and mystery-driven progression.

      Historical and visual research: Rome's architecture, landmarks, and historical imagery, to establish the game's visual context.

      Environment and level development: the main locations, translated from the research into a cohesive game world.

      3D visual development: rendered environmental scenes exploring the atmosphere and dramatic potential of the setting.

      Game design documentation: gameplay objectives, player profiles, controls, accessibility considerations, and audio direction.
  - type: text
    heading: Outcome
    body: |
      ChronoLens brings together narrative thinking, historical investigation, and digital environment development to explore how a real city's cultural heritage can become the foundation of an immersive fictional experience.
