  - type: text
    heading: Built on a grid
    body: |
      Every angle in the symbol and every stroke in the logotype sits on a set of guide lines: the bird's neck, back and legs follow the same few slopes as the red shape around it, and the letters share one stroke weight, one baseline and one cap height across both scripts. Drawn this way, the marks can be taken apart and rebuilt line by line, which is what makes them work in motion.
