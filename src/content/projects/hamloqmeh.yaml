title: Hamloqmeh
status: published
categories: [digital-ui]
order: 10
tags: [Product concept, UI design, Persian, Right-to-left]
summary: A Persian-language platform that connects food businesses with customers to reduce food waste.
overview: |
  A Persian-language platform connecting food businesses with customers to reduce food waste. I developed the concept and designed the visual identity, website, and app interfaces, including right-to-left layouts and customer and business journeys.
role: Product Concept, Visual Design & UI Design
development: AI-assisted development. Concept, visual identity and interface design by Setayesh Ganji.
