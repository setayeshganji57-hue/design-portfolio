  - type: text
    heading: The language
    body: |
      The pattern takes the half circle of the chair back and repeats it, rows of seats pushed in and pulled out, like a busy café seen from the ceiling; where two half circles meet they close into a full circle, two people sitting face to face. The menu icons, croissant, bread, toast, sandwich, salad, egg and cup, are drawn in the same rounded line inside the two shapes of the logo, and the tall hang tags take the arched end of the table and turn it upright. Round stickers close bags, cups and boxes. The tone of voice is warm and direct, and its lines all end the same way: "find it at Social."
  - type: pair
    tiles: wide
    items:
