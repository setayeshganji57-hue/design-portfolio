summary: A stop-motion advertisement film made from more than 1,000 shots, in which fruits fall in love.
overview: |
  A stop-motion video for advertisement, made from more than 1,000 individual shots. Fruits such as banana and strawberry, apple and kiwi meet, fall in love, and become smoothies made from that love.

  Edited in Adobe Premiere Pro and After Effects. The brief asked for a video in the category of education or advertisement.
