blocks:
- type: text
  heading: Two letters, two scripts
  body: |
    The mark is drawn from a single square module on a three-by-three grid. Read in Latin, it spells F and P, for Foam and Pars. Read in Persian, it spells ف and پ, the first letters of فوم and پارس, and the loose squares do double duty as the dots of the Persian letters: one above for ف, three below for پ. Because every measurement is a multiple of the module, the mark holds at any size.
- type: pair
  tiles: wide
  items:
  - { file: pfc/board-03-logo-construction.jpg, alt: "Logo construction board: the mark on a three-by-three grid, measured in modules" }
  - { file: pfc/board-06-logo-concept.jpg, alt: "Concept board: F and P in Latin and \u0641 and \u067e in Persian combine into one mark" }
- type: text
  heading: Colour and type
  body: |
    Four colours come from the workshop floor: oxblood for the mark and headlines, graphite for text, raw foam for supporting shapes, and paper white, the only ground the logo sits on. Every text pairing is checked for WCAG contrast. Chicago Flat sets the Latin and Far Beirut the Persian; both are heavy, low-contrast and built from flat geometric strokes, so the two scripts carry the same weight when they share a line.
- type: pair
  tiles: wide
  items:
  - { file: pfc/board-04-colour-palette.jpg, alt: "Colour palette board: oxblood, graphite, raw foam and paper, with contrast pairings" }
  - { file: pfc/board-05-typography.jpg, alt: "Typography board: Chicago Flat for Latin and Far Beirut for Persian" }
- type: text
  heading: One family of drawings
  body: |
    The illustrations, from single icons to a full workshop scene, follow the same few rules: one heavy oxblood line with rounded ends, paper and foam splitting light from shade, and rounded shadow bars rising at 35 degrees behind each drawing. Three boards take one icon, one tool and one scene apart, step by step.
- type: pair
  tiles: wide
  items:
  - { file: pfc/board-07-illustration-system.jpg, alt: "Illustration system board: the workshop scene and eight icons in one style" }
  - { file: pfc/board-08-illustration-light-bulb.jpg, alt: "Light bulb board: the icon built in four steps" }
- type: pair
  tiles: wide
  items:
  - { file: pfc/board-09-illustration-pen-tool.jpg, alt: "Pen tool board: the icon built in four steps" }
  - { file: pfc/board-10-illustration-workshop.jpg, alt: "Workshop board: the scene built in four steps" }
- type: text
  heading: In use
  body: |
    The identity carries into stationery, ID badges, a catalogue, a folded brochure and a set of social icons, all in Persian and all on white, where the mark keeps its three tones.
