title: Posters
status: published
categories: [graphic-illustration]
order: 40
tags: [Poster, Typography, Event design]
summary: Five event and exhibition posters, each built around one idea, shown as artwork and in place.
overview: |
  Five briefs, five ways of making type and image carry an event: exhibitions, a biennale, a leadership forum and a typography competition. Each poster is built around one idea and one material: extruded letters, neon, marbled ink, balanced shapes and warped lines.

  In every poster the title is also the image, so the event is recognisable before a single word is read. Each one is shown as flat artwork and in place, on a billboard, a street panel, a wall or a frame in a room, where it would actually be seen.
