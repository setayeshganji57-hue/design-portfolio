blocks:
  - type: text
    heading: A singer's house full of sound
    body: |
      The exhibition took place in a 113-year-old house on Khark Street that had belonged to Fakhereh Saba, who went to France in 1937 to study opera and became one of the first Iranian women opera singers. Divar restored the empty house in 2017; in 2025 the exhibition, a tribute to her, let visitors hear the first sounds recorded in Iran through interactive devices. The brief was not just an event poster: it had to carry the idea of sound, and of a building where Iranian music history had lived.

      Sound can't be printed, so instead of picturing a speaker or a sound wave, the poster shows the thing in between: a contraption that sound runs through, from source, along pipes and wires, out of a horn, with the exhibition's own name as its body.
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/board-03-the-house.jpg, alt: "The house and the voice board: Fakhereh Saba, the Karestan door and the exhibition, with a timeline" }
      - { file: soundscape-of-iran/board-04-the-idea.jpg, alt: "The idea board: source, coupling, signal, output, and three design decisions" }
  - type: text
    heading: Every stroke is a part
    body: |
      The poster reads from top to bottom: an English arc, the Persian title lettered from pipes, cables wiring the words together, the machine running down into pipes and horns, a large gear, and the information set inside the machine's own boxes, in two calendars and two languages. In the lettering, every feature of a Persian letter is swapped for a mechanical part that does the same job: a dot becomes a cube, a terminal an open pipe, a curve an elbow, a joint a mesh coupling, so the title still reads, but as hardware.
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/board-05-anatomy.jpg, alt: "Anatomy board: the poster with nine numbered parts" }
      - { file: soundscape-of-iran/board-06-lettering.jpg, alt: "Lettering board: eight letter features and the parts that replace them" }
  - type: text
    heading: Ten parts, one machine
    body: |
      Everything in the identity, poster, emblems and social posts, is assembled from the same ten parts drawn in one isometric line style: open pipe, horn, mesh coupling, plates and cube, cables, gear and rack, valve wheel, records and knobs, screen and hand wheel. Signal red, kraft, ink and black give it the look of an old printed technical drawing, and one drawing works in three colourways.
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/board-07-kit-of-parts.jpg, alt: "Kit of parts board: the ten parts of the machine" }
      - { file: soundscape-of-iran/board-08-colour-and-paper.jpg, alt: "Colour and paper board: signal red, kraft, ink and black, and one drawing in three colourways" }
  - type: text
    heading: The system
    body: |
      The poster's parts were rebuilt as stand-alone square images, a radio emblem, a gear train and a sound machine, each working as an emblem, a profile picture or a sticker. A five-slide carousel, published jointly with Divar, introduced the exhibition through its sponsor, the house, the singer, the restoration and the invitation. Each of the exhibition's interactive sound devices got its own animated title card, its invented Persian name lettered in heavy kraft type inside a drawn frame, and the other posts reuse the kit of parts so the feed reads as one identity.
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/board-09-illustration-family.jpg, alt: "Illustration family board: radio emblem, gear train and sound machine" }
      - { file: soundscape-of-iran/board-10-launch-carousel.jpg, alt: "Launch carousel board: five slides, one story" }
  - type: image
    media: { file: soundscape-of-iran/board-11-social-posts.jpg, alt: "Social posts board: nine device title cards and six identity posts" }
  - type: text
    heading: In the world
    body: |
      The poster was printed and pasted around Tehran, on white walls, shop shutters and crowded noticeboards, where one dense machine on a flat red ground stands out. Inside the house, the exhibition used real pipes, horns and wires on bare concrete; visitors put their ears to pipe mouths to hear the first sounds recorded in Iran, the same parts the poster is lettered from. The photographs of the space are the exhibition's own documentation.
  - type: pair
    tiles: wide
    items:
