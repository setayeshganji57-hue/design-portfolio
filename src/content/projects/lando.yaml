  - type: text
    heading: A system of shapes
    body: |
      Loosened from the baseline, the letters become a game: strokes tilt, dots scatter and the O turns into a maze, a looser version kept for moments of celebration, while the upright wordmark does the everyday work. Six biscuit shapes drawn with the same stroke, a dotted square, a dotted round, twin fingers, a layered bar, a flower and a ring, become an emblem when arranged in a radial burst and patterns when repeated. Nine patterns grow from parts already in the system, light versions to sit behind text and dense ones to cover whole surfaces, and the smallest pieces, round stickers, hanging tags and a rubber stamp, carry the monogram, the wordmarks and the playful lettering.
  - type: pair
    tiles: wide
    items:
