title: PERSO — A historical treasure hunt through 18th-century Rome
status: published
categories: [interactive-3d]
order: 20
tags: [Game design, Narrative design, 3D environment design]
year: 2022
context: { type: academic, institution: Sapienza University of Rome }
summary: A third-person adventure game set in 18th-century Rome, built from architectural models of the Regola district.
overview: |
  What if the streets, architecture, and hidden corners of historical Rome became part of an interactive mystery?

  PERSO is a third-person adventure game that transforms a historic district of Rome into an explorable world, bringing together architectural research, environmental design, and narrative-driven gameplay.

  Set in 18th-century Rome, the game follows Aurelia on a quest to find her brother, Saverio, a treasure hunter who has stolen a valuable treasure from the royal treasury. With only the knowledge that he is somewhere in Rome, Aurelia must explore the city, interact with objects, collect clues, and solve challenges to uncover his whereabouts.
role: Game design, narrative development, 3D modelling of every building, environment design in Unreal Engine, all game coding. Designed with the guidance of a professor at Sapienza.
tools: [Rhinoceros 3D, CAD, Unreal Engine]
