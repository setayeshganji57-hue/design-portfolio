summary: Seven ink illustrations about what happens inside a head, drawn in three colours for an exhibition at a modern art gallery in Tehran.
overview: |
  Seven illustrations about what happens inside a head, made as an academic project at the University of Fine Arts in Tehran and shown at a modern art gallery in the city. Each drawing opens the head in a different way: a mask hiding a black void, with a hand pressing out from inside; a man face to face with his own face struck on a coin; an old face cut into slipping slices; a profile melting into currents; a figure on a wireframe globe whose head turns to smoke; a reader whose head blooms into flowers; and an elephant carrying a mountain range under a coral sun.

  The set shares one visual language: fine hand-hatched line, solid black, and a single coral on a warm paper ground. Read in order, it moves from closed to open, from a masked head to something patiently carried.
