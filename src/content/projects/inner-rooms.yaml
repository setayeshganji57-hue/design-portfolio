blocks:
  - type: text
    heading: Three colours, one line
    body: |
      Most of the figures have no clear face to read; the feeling is carried by what replaces it. All seven pieces follow the same few rules, which is what makes them read as one series rather than seven separate drawings: fine-pen hatching for skin, cloth and hair, the realistic half of each image; solid black for voids, hair and smoke, where the image stops being realistic; coral as the only colour, kept for the most human parts, skin, hands, a sun; and one figure, centred, on an empty paper ground.
  - type: pair
    tiles: wide
    items:
      - { file: inner-rooms/board-03-brief.jpg, alt: "The brief board: drawing the inside of a head, with the Behind the Mask illustration" }
      - { file: inner-rooms/board-04-visual-language.jpg, alt: "Visual language board: paper, coral and ink, with details of hatching and solid black" }
  - type: text
    heading: Seven rooms
    body: |
      Behind the Mask hollows a head out to pure black, and a single hand presses outward. Two Sides shows one profile twice, once alive and once minted. Layers cuts an old face into slices that have slipped. Drift lets a young profile melt from the eyes backwards into currents and leaves. Burning Out sets a crouching figure on a wireframe globe, its head turned to black smoke. In Bloom replaces a reader's head with a bouquet, the quietest and most hopeful piece. What We Carry ends the series not with escape but with weight: an elephant walking under a coral sun with a mountain range on its back.
