blocks:
- type: text
  heading: Three kinds of Persian learner
  body: |
    The same app has to work for an eight-year-old in Toronto, a teenager looking for identity, and an adult who fell for Rumi. The design separates them from the very first screen, then adapts content, tone and level: story-led and playful for diaspora kids, guided by a parent; identity, community and voice for second-generation teens; poetry, history and culture for global learners.
- type: pair
  tiles: wide
  items:
  - { file: parsitalk/board-03-the-idea.jpg, alt: "Learning a heritage, not just a language board: stories first, hear it, say it, write it, belonging" }
  - { file: parsitalk/board-04-audiences.jpg, alt: "Three kinds of Persian learner board: diaspora kids, second-gen teens and global learners" }
- type: text
  heading: Structure
  body: |
    Instead of a sign-up form, the app asks five friendly questions, who you are, your age, your level and what you want from Persian, and builds a learning profile from the answers, with a progress bar that keeps the flow short and clear. Every feature then hangs from one home, the dashboard, in four directions: learn, practise, explore and parents, so nothing is more than one tap from the dashboard. The landing page opens on the emotional promise, "Connect with Your Persian Heritage", and greets visitors in Persian and English side by side.
- type: pair
  tiles: wide
  items:
  - { file: parsitalk/board-05-onboarding.jpg, alt: "Five questions, one personal path board: the five onboarding steps" }
  - { file: parsitalk/board-06-product-map.jpg, alt: "One home, four directions board: the product map" }
- type: image
  media: { file: parsitalk/board-07-landing-page.jpg, alt: "Welcome in two languages board: the landing page on desktop and phone" }
- type: text
  heading: The experience
  body: |
    The home screen shows learning as themed journeys, Iranian festivals, animals and nature, family life, poetry and tales, city adventures, each with its level and progress, plus a daily goal, a streak and a cultural tip. Each story scene combines everything a learner needs in one card: a Persian sentence with listen and show-translation, new words with audio, a comprehension question and a speaking practice. A voice coach shows each word in Persian script, English and transliteration and plays an example; calligraphy practice lets learners trace letters stroke by stroke; an interactive map of Iran unlocks cities as lessons are finished; ParsiWorld is a moderated community for young learners; and a parent dashboard shows each child's weekly progress.
