  - { file: drymto/board-03-logo-construction.jpg, alt: "Logo construction board: the phoenix drawn from one circle, with measurements" }
- type: pair
  tiles: wide
  items:
  - { file: drymto/board-04-logo-concept-versions.jpg, alt: "A phoenix for every dream board: the concept and the logo versions" }
  - { file: drymto/board-05-colour.jpg, alt: "Gold coin, night sky board: dream gold, night cobalt, charcoal and mist" }
- type: image
  media: { file: drymto/board-06-typography.jpg, alt: "Typography board: Yekan Bakh in Latin and Persian, with the type hierarchy" }
- type: text
  heading: Three people, one dream
  body: |
    Mapped from the project's own website roadmap: someone creates a fundraiser, a supporter contributes in crypto, and the beneficiary sets up a payout, each journey one question per screen. The structure was settled in Persian first, right to left, then carried into an English interface; what survived the move is what the brand stands on.
- type: pair
  tiles: wide
  items:
  - { file: drymto/board-07-user-flows.jpg, alt: "Three people, one dream board: the three user flows across 28 screens" }
  - { file: drymto/board-08-wireframe-to-ui.jpg, alt: "From a Persian wireframe to the UI board" }
- type: text
  heading: The screens
  body: |
    The home page is a long scroll told as a story, with the phoenix at full size and one START button. Log-in and sign-up split the screen in two, with the brand on one side and soft pill-shaped fields on the other. A dream card puts the goal, the amount and the donate button in one place; "Be a dreamer" invites people to tell their story; a wizard creates a fundraiser one question per screen; and a payout setup carries the money to the dream.
