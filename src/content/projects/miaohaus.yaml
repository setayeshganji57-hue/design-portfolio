summary: Visual identity, event posters, and a photographic fanzine for creative workshops in Ostia.
overview: 'Context: Art and design workshops at Teatro del Lido, Ostia


  For Miaohaus, I created a visual identity and a fanzine documenting a programme of creative workshops. My work brought together the logo, graphic language, event posters, publication layout, and photography.


  A pixel-style cat, stepped shapes, directional arrows, and a bright colour palette give the project its playful character. These elements connect the promotional materials and publication, creating a consistent identity across different activities.


  I also photographed the workshops, documenting participants, materials, and the work they created. The fanzine combines these photographs with event information, moving between the programme’s visual identity and the hands-on experiences behind it.'
role: Visual identity, logo design, event posters, editorial design, and photography.
