title: Posters
status: published
categories: [graphic-illustration]
order: 40
tags: [Poster, Typography, Event design]
summary: A collection of event and exhibition posters, each shown as a poster and in its setting.
overview: |
  A collection of posters for events and exhibitions. Each poster is shown twice: as a printed poster, and at the scale of the street or the room where it would be seen.
cover:
  file: poster-collection/mef-street.jpg
  alt: Blue MEF Leadership Forum poster in a street display case
  aspect: "1/1"
  fit: cover
blocks:
  - type: text
    heading: MEF Leadership Forum, Rome
    body: |
      A poster for the MEF Leadership Forum in Rome on 9 May 2023, at Lungotevere dei 26, The First Musica. The letters "mef" are extruded into deep, fading three-dimensional forms that sweep across a flat blue field, with the event details set small in a technical display face.
  - type: pair
    align: center
    items:
      - { file: poster-collection/mef-street.jpg, alt: The MEF Leadership Forum poster in a street display case next to a tram stop, fit: contain }
      - { file: poster-collection/mef-billboard.jpg, alt: The same design adapted to a landscape billboard among trees, fit: contain }
  - type: text
    heading: No, Neon No Cry
    body: |
      A poster for "No, Neon No Cry" at MAMbo, Project Room, from 12 May to 23 October 2022. The title is written as glowing neon script on a deep red ground, with the venue and dates in the same neon hand below.
  - type: pair
    align: center
    items:
      - { file: poster-collection/no-neon-plinth.jpg, alt: The framed No Neon No Cry poster standing on stone plinths in warm light, fit: contain }
      - { file: poster-collection/no-neon-chair.jpg, alt: The framed poster resting on a wooden chair against a sunlit wall, fit: contain }
  - type: text
    heading: Typography Competition 2022
    body: |
      A call-for-entries poster for a typography competition in 2022. The title sits above a marbled swirl of teal, grey and charcoal, cut through by rounded vertical bars that carry the call for entries and the year, set at a right angle to the reader.
  - type: pair
    align: center
    items:
      - { file: poster-collection/typography-table.jpg, alt: The framed teal Typography Competition poster lying on a wooden bench in dappled light, fit: contain }
      - { file: poster-collection/typography-curtain.jpg, alt: The same poster standing on the floor in front of linen curtains, fit: contain }
  - type: text
    heading: Media Architecture Biennale, MAB
    body: |
      A poster for the Media Architecture Biennale, from 28 June to 2 July 2021. Simple geometric shapes, a circle, two half-circles and three arches, balance on top of one another in navy, violet and olive on a speckled off-white ground, beside the event title in a stencil display face.
  - type: pair
    align: center
    items:
      - { file: poster-collection/mab-billboard.jpg, alt: The Media Architecture Biennale design on a landscape billboard against blue sky, fit: contain }
      - { file: poster-collection/mab-wall.jpg, alt: The portrait poster pasted on a concrete wall behind bamboo leaves, fit: contain }
  - type: text
    heading: Kandinsky, Gaudí, Klee — The Dubai Mall
    body: |
      A series of three exhibition posters for The Dubai Mall, from September 2022. They share one system: bands of lines that warp around solid circles, as if the dots were weighing down the surface. Only the colour changes for each artist, blue for Kandinsky, ochre for Gaudí and green for Klee.
  - type: image
    size: full
    media: { file: poster-collection/dubai-mall-wall.jpg, alt: The three posters pasted side by side on a grey wall, fit: contain }
  - type: grid
    columns: 3
    items:
      - { file: poster-collection/dubai-mall-kandinsky.jpg, alt: Blue Kandinsky poster with warped lines and four circles, fit: contain }
      - { file: poster-collection/dubai-mall-gaudi.jpg, alt: Ochre Gaudí poster with warped lines and four circles, fit: contain }
      - { file: poster-collection/dubai-mall-klee.jpg, alt: Green Klee poster with warped lines and four circles, fit: contain }
