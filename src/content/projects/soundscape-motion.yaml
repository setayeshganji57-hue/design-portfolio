  - type: text
    heading: A machine built from ten parts
    body: |
      Everything in the identity is assembled from the same ten parts, drawn in one isometric line style: open pipe, horn, mesh coupling, plates and cube, cables, gear and rack, valve wheel, records and knobs, screen and hand wheel. In the poster they stand still as letters; in the films the same kit becomes a mechanism, so the motion never needs a new visual language, only the parts already designed.

      Every feature of the Persian lettering was swapped for a part that does the same job, a dot for a cube, a terminal for an open pipe, a curve for an elbow, a joint for a mesh coupling, which is what lets the title come apart and come back together as hardware.
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/board-07-kit-of-parts.jpg, alt: "Kit of parts board: the ten parts of the machine" }
      - { file: soundscape-of-iran/board-06-lettering.jpg, alt: "Lettering board: eight letter features and the parts that replace them" }
  - type: text
    heading: Part of a wider system
    body: |
      The films sit alongside the rest of the exhibition's social media: animated title cards for each of the exhibition's interactive sound devices, their invented Persian names lettered in heavy kraft type, and posts that reuse the kit of parts so the feed reads as one identity.
