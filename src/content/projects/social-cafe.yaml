tags: [Brand identity, Bilingual logotype, Packaging, Café]
year: 2021
context: { type: commissioned, institution: Social Cafe }
location: "Tehran, Iran"
audience: "Café-goers in Tehran, including strangers who come to share the long table"
summary: Identity for Social Cafe in Tehran (2021, still open), a café built around one long communal table, with a logo drawn from the table and chairs seen from above.
overview: |
  Social Cafe is built around one long, rounded blue table where strangers sit side by side. The table and chairs were designed for the café, and the identity was designed with them. Instead of inventing a symbol, the logo is the furniture itself, seen from above. The café opened in Tehran in 2021 and is still open.

  The table becomes a rounded pill shape, the chair backs become six half circles, and six small rings mark six places: a table that is already full, which is what "social" means. The Persian کافه سوشال and the English SOCIAL CAFE are drawn on one grid, with heavy, rounded strokes as thick as the table's edge, and the long stroke in the Persian line stretches like the tabletop.

  The colours come from the room: table blue, the chairs' orange toned down to terracotta, cream like milk foam and paper, and the grey of the plaster walls. A pattern of repeated chair backs and menu icons set inside the chair circle or the table pill make up the graphic language, and the voice is warm lines that all end the same way: "find it at Social." The identity runs through the whole café: menus, price cards, cup sleeves, bags, coffee labels, business cards, the storefront sign, the door and the staff uniforms.
role: Logo and symbol, Persian and Latin logotype, colour, pattern, icons, stickers, menus, packaging, stationery, signage and uniforms
