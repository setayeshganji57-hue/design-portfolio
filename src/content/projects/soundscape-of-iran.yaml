  - type: text
    heading: Social media
    body: |
      I designed and wrote posts for the exhibition's Instagram account, @soundscape.iran, carrying the same red, kraft and line drawing into the feed: the poster and illustrations adapted as posts, and a typographic series that introduces the exhibition's sound instruments one by one, each name set in Persian inside a frame of drawn hardware.

      One carousel, published together with Divar, tells the story behind the venue. The Karestan Building on Khark Street was home for nearly four decades to Fakhereh Saba, who went to France in 1937 to study opera and became one of the first Iranian women opera singers. Divar restored the empty house in 2017, and the exhibition, a tribute to her, lets visitors hear the first sounds recorded in Iran through interactive instruments, free of charge.
