      - { file: hamloqmeh/app-login-mobile.jpg, alt: Hamloqmeh app log-in screen on a phone, in Persian, fit: contain, background: "#f5f7fa" }
  - type: text
    heading: App
    body: |
      The app asks people to log in before they can view and reserve food packages.
