- type: text
  heading: System
  body: |
    The colours carry Persian names: Safavid blue, pomegranate red, jegari, saffron and ivory, with a gradient from Safavid to pomegranate kept for the main headline and the big calls to action. Geist Sans sets the interface, with Persian always next to its English meaning, and every screen reflows to a single column on a phone, where the main actions stay within thumb reach.
