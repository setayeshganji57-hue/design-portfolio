title: KINEKO 2025 — A festival identity built from a camera with a smile
status: published
categories: [brand-identity]
order: 5
tags: [Visual identity, Character design, 3D and motion, Poster design, Illustration]
year: 2025
context: { type: commissioned, institution: KINEKO International Film Festival }
summary: Commissioned by KINEKO International Film Festival in Tokyo. Visual identity, 3D character, motion piece and poster for its 2025 edition.
overview: |
  KINEKO is an international film festival for children and teenagers, held each autumn in Futako-Tamagawa, Tokyo, and one of the largest of its kind in Japan. The festival commissioned me to create the visual identity for its 2025 edition, which ran from 31 October to 4 November. I built it around one idea: a character made out of cinema itself.

  The character is a film camera turned into a friendly tower. A megaphone is its voice, two film reels are its eyes, and a wide red smile, coloured cables, a small door and a spiral staircase turn the machine into a place a child could climb into. The festival's number sits on its head like a hat. The tone is playful without talking down to its audience, and the figure reads clearly at any size.

  I developed the identity in two directions that share the same shapes and colours. In three dimensions, the character is modelled in Cinema 4D for the poster and the motion piece. In two dimensions, it breaks down into a flat language of circles, triangles and bars in yellow, blue, red and green, which becomes illustrations, crayon-textured drawings, patterns and banners, so the identity can stretch from a single poster to a whole festival site.

  The final outcome is a 4D piece, the identity in motion, together with the poster and a family of illustrations and applications.
