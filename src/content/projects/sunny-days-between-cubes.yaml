title: Sunny Days Between Cubes — Translating everyday movements into a visual language
status: published
categories: [motion-film]
order: 10
tags: [Visual communication, Motion studies, Exhibition design]
year: February 2023
context: { type: academic, institution: Sapienza University of Rome, course: Performing Arts and New Media Studio }
summary: An experimental visual communication project that turns students' everyday movements into graphic scores, motion studies and an exhibition concept.
overview: |
  What if everyday human activity could be translated into a choreography of shapes, lines, and moving images?

  Sunny Days Between Cubes is an experimental visual communication project that explores the relationship between human movement, geometric abstraction, and architectural space. Starting with the observation of students in a shared resting area at Sapienza University of Rome, the project investigates how ordinary gestures (writing, typing, and conversation) can be observed, abstracted, and transformed into a new visual language.

  By translating physical movements into graphic scores and animated forms, the project reveals the hidden rhythms of everyday life. These visual explorations culminate in a transmedia exhibition concept that brings the resulting imagery back into the physical environment where the original movements took place.
role: Site study, visual scores, motion studies and exhibition concept, in a collaborative academic project
