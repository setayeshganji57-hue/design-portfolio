title: Maan — One line, three circles, a brand for coffee, pastry and bread
status: published
categories: [brand-identity]
order: 8
tags: [Brand identity, Packaging, Bilingual typography, Café]
context: { type: commissioned, institution: "Maan, Tehran" }
summary: Complete visual identity for Maan, a bakery, pastry shop and coffee house in Tehran, from the bilingual logo to packaging, cups, menus, signage and social media.
overview: |
  Maan (مان) is a bakery, pastry shop and coffee house in Tehran. I designed its complete visual identity, from the logo and colour palette to the packaging, cups, menus, signage and social media.

  The challenge was to bring three different crafts under one name, in two scripts. The logo stacks the Persian مان above the Latin maan. Both are drawn with the same single straight line and fitted to exactly the same width, so they read as one mark rather than a translation. A wide monospace tagline, Coffee Pastry Bread, names the three things the shop makes.

  Each product became a circle with one simple cut: parallel lines for bread, eight slices for pastry, and a split down the middle for a coffee bean. Together the three circles work as a second logo. They also grew into a library of about fifteen round patterns used on tape, boxes and backgrounds. The palette is a deep green on white and natural kraft, with a single red kept for the round stamp that seals each bag.

  For the shop's three roasted house blends, the name became the label. 50, 80 and 100 stand for the share of Arabica in each blend. Each number is drawn in the logo's stroke, with the brand's patterns inside its loops, and each label carries a short description and a five-square scale for acidity, bitterness, sweetness, body and roast, so customers can compare the blends at a glance. A single-origin edition and a Turkish coffee bag extend the same system.
role: Logo, colour palette, typography, icons and patterns, stamps and stickers, coffee packaging and labels, cups, menus, signage, social media
