  - type: text
    heading: "Lesson 2: Stop-motion animation (29 April 2022)"
    body: |
      This lesson introduces stop-motion: objects physically moved and photographed frame by frame, so that they seem to move on their own when the frames are played in sequence.

      It is organised by technique, each traced through its history with film examples: objects animation, from Méliès to the Quay Brothers; puppet animation, including armatures, replacement heads and puppet fabrication; claymation, from Willis O'Brien to Aardman; cut-out and silhouette animation, from Lotte Reiniger to Emanuele Luzzati; and pixillation. It closes with the twelve principles of animation and a filmography.
