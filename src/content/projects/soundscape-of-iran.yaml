blocks:
  - type: pair
    tiles: wide
    items:
      - { file: soundscape-of-iran/poster.jpg, alt: "Soundscape of Iran poster, the Persian title built from kraft-coloured pipes and machine parts on red" }
      - { file: soundscape-of-iran/poster-on-kraft.jpg, alt: The printed poster on a kraft-paper background }
  - type: text
    heading: Lettering as machinery
    body: |
      Each letter of صحنهٔ صدای ایران is assembled from plumbing and audio hardware: elbows and joints for the strokes, horns where sound would come out, coiled cables linking one word to the next. Below the title the pipes keep running into a larger machine, and the poster's practical information sits inside it: the dates, the opening hours, the venue, the credits and the supporter, all in the same drawn line.
  - type: text
    heading: A family of illustrations
    body: |
      The parts of the poster were drawn again as square illustrations for the exhibition's social media: three pipe compositions in the identity's three colourways, kraft on red, red on black and line on kraft, and three mechanical emblems, a sound machine, a vintage valve radio carrying the English title, and a gear train inside a toothed ring.
