context: { type: commissioned, institution: Zameen Art House }
location: "Vancouver, British Columbia, Canada"
audience: "Vancouver's art and culture community, Persian-speaking and not, who come to the house for exhibitions, events and workshops"
summary: Complete identity for Zameen Art House in Vancouver, built from the Persian word for earth with a circle, a stroke and a diamond.
overview: |
  Zameen (زمین) means "earth" in Persian. Zameen Art House is "a home to celebrate art, culture, and community, where creativity takes root and connections blossom." I designed its complete identity, from first concept to the final system.

  The logo is the Persian word itself, written with only three shapes: a circle, a straight stroke and a diamond. The diamond comes from the dot of Persian calligraphy, which the reed pen cuts as a small rhombus; here it becomes the dots of the letters and a seed at the centre of every circle. The circle is the earth. The long stroke is the keshideh, the stretching stroke of Persian script, which becomes a horizon line.

  For the symbol, the first letters stand upright as a seed, a stem and a root, with the circle rising behind like a sun; placed in an arch, it becomes the doorway of the "house". The English name is set in a thin square typeface inside a stepped frame, like rooms in a floor plan. The colours are earth sand, sage green and Pacific blue, and fine construction lines, like an architect's drawing, make every post look built from the same kit. On Instagram, the logo's long stroke stretches across three posts: each one looks abstract alone, and together they spell زمین.
role: "Complete brand identity, from concept to final system: Persian logotype, symbol, Latin wordmark, colour, graphic language and social media"
