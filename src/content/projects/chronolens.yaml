summary: A non-violent game set in the Pantheon area of Rome, built in Unreal Engine with 3D objects modelled in Rhino.
overview: |
  A non-violent game designed in the area around the Pantheon in Rome. The story follows a 23-year-old history student who finds a camera in an antique shop, which is the tutorial of the game. She then wakes up in another place, where the weather is heavy and snowy and the city is empty and gloomy.

  Her aim is to understand where she is and what she has to do. On her journey she meets a young girl, an angry man, and a series of challenges.

  The 3D objects were designed in Rhino and imported into Unreal Engine, where Blueprints control the characters. A game design document (GDD) shows every step of the project, and a tutorial and a trailer were delivered as outcomes.
