summary: An A3 infographic poster summarising my master's thesis on extended reality in virtual museums.
overview: |
  An A3 poster that explains the thesis briefly and expressively: "Bridging Boundaries: Utilizing Extended Reality (XR) for Virtual Museums (VM) to Foster Art Appreciation and Learning in Persian-Speaking Communities of Three Growing Countries".

  The poster uses charts, a target-group section and a diagram of how the approach works, and was made in Adobe InDesign and Photoshop.
