title: Soundscape of Iran — A poster built like a sound machine
status: published
categories: [graphic-illustration]
order: 5
tags: [Poster design, Persian lettering, Illustration, Social media, Exhibition]
year: January 2025
summary: Poster, Persian lettering, illustrations and social media for Soundscape of Iran, a sound exhibition in Tehran supported by Divar.
overview: |
  Soundscape of Iran (صحنهٔ صدای ایران) was a sound exhibition held at the Karestan Building in Tehran from 10 January to 7 February 2025, supported by Divar. I designed its poster and a family of illustrations around one idea: if the exhibition is about sound, the poster should look like the machine that makes it.

  The Persian title is lettered out of pipes, horns, cables, gears and speaker parts, so the words read as a working apparatus that sound could travel through. A muted red ground and a kraft-paper texture give it the feel of an old printed technical drawing, and the event information is set inside the machine's own boxes and panels, in Persian and English, rather than placed on top of it.

  The same parts became stand-alone illustrations: square compositions of pipes, a vintage radio emblem, a gear train and a sound machine, made to extend the identity across social media and print. The poster was printed and posted around the city, and I designed and wrote posts for the exhibition's Instagram account.
role: Poster design, Persian lettering, illustration, and social media design and copywriting.
