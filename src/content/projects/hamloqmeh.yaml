blocks:
- type: text
  heading: Explaining a new service
  body: |
    The homepage opens with the offer in one line, good food today with a big end-of-day discount, and a single call to join the waitlist. A small label says the service is in its trial phase. Three stacked cards beside the headline preview the whole journey: a bakery's package available today, reserved at a discount, and collected in a set time window.

    The next sections answer the first questions a visitor has. Why does this food exist? Because good food is still left at closing time. How does it work? Three numbered steps: discover the day's packages, reserve one at a discount, and pick it up in person.
- type: image
  media:
    file: hamloqmeh/website-how-it-works.jpg
    alt: The problem statement on a pale green band, followed by the three steps of how Hamloqmeh works
- type: text
  heading: Two audiences, one page
  body: |
    Hamloqmeh needs both customers and food businesses, so the page speaks to each side in its own card: savings and local discovery for customers, extra income and new neighbourhood customers for businesses, with a separate call to partner. A row of labels lists the kinds of business that can join, from bakeries and cafés to supermarkets and greengrocers.
- type: image
  media:
    file: hamloqmeh/website-audiences.jpg
    alt: Two cards, one for customers and one for food businesses, above the list of business types that can join
- type: text
  heading: Values and the waitlist
  body: |
    The closing sections explain why the idea matters, that every package chosen means the water, energy and work behind that food were not wasted, and answer common questions in an expandable FAQ. The page ends with a short waitlist form that asks only for a name, an email or mobile number, a city, and whether the person is a customer or a business, with a clear consent line and a link to the privacy policy.
- type: pair
  tiles: wide
  items:
