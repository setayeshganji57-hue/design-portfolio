summary: Brand identity and three vertical motion films for MOA Coffee Roasters in Tehran, bringing the logo, its construction grid and its long-legged bird to life.
overview: |
  MOA is a coffee roaster in Tehran. I designed its complete brand identity, the logotype and the symbol, and then the motion films that set it moving. The identity rests on two marks. The logotype writes the name in Persian and Latin as one line, in heavy, squared red letters joined by a long horizontal stroke, with small diamond counters cut into the round forms. The symbol is a long-legged bird drawn in a single cream line inside a tilted, angular red shape, with the roaster's line, "Proudly Roasted in Tehran, Iran", set in a circle around its head.

  Both marks are built on construction grids of fine guide lines, and the motion films use that structure: they show the logo drawn on its grid and the brand in use, made in a vertical 9:16 format for social media. There are three films, between twelve and fifty-seven seconds long, in the identity's signal red and warm cream.
role: Brand identity, logo and symbol design, motion design and animation
year: April 2017
