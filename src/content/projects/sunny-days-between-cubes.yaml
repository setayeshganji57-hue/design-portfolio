blocks:
  - type: text
    heading: Choreography without dancers
    body: |
      With the tools of scoring, writing actions down precisely, any movement can be recorded, abstracted and turned into another form of art. This project applies that idea to the most ordinary movements there are: students writing, typing and talking at their tables. It moves in four steps: observe people in a real place, score each action as a mark, animate the marks as moving images, and return the images to the place.
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-01-cover.jpg, alt: "Cover board: Sunny days between cubes, with glass spheres and red points" }
      - { file: sunny-days-between-cubes/board-03-the-idea.jpg, alt: "The idea board: observe, score, animate, return" }
  - type: text
    heading: Observe
    body: |
      The site is a resting area in the north-western part of Sapienza's main campus: eight large tables, sixteen benches, and a ceiling of rods that throws striped shadows across everything, changing hour by hour. It was redrawn as data, its outline, the grid of tables, the rhythm of the roof's stripes and the paths people take, and narrowed step by step to one table. Photographed from directly above in black and white, a person becomes a moving mark on a flat plane, already halfway to a drawing.
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-04-the-site.jpg, alt: "The site board: the shaded resting area on Sapienza's main campus" }
      - { file: sunny-days-between-cubes/board-05-reading-the-space.jpg, alt: "Reading the space board: from the plan to the grid of tables" }
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-06-point-of-view.jpg, alt: "Point of view board: the site photographed straight down in black and white" }
      - { file: sunny-days-between-cubes/board-07-the-vocabulary.jpg, alt: "The vocabulary board: four actions, four shapes" }
  - type: text
    heading: Translate
    body: |
      Each everyday action was watched until its rhythm could be named, then given one simple graphic form. Writing becomes a zigzag line, typing becomes squares that multiply until they cover the table, talking becomes circles and sound waves, and in the last phase a group does everything at once, and the video layers all three translations on the same table.
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-08-phase-1-writing.jpg, alt: "Phase 1 board: writing becomes zigzag lines" }
      - { file: sunny-days-between-cubes/board-09-phase-2-typing.jpg, alt: "Phase 2 board: typing becomes squares" }
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-10-phase-3-conversation.jpg, alt: "Phase 3 board: talking becomes circles and sound waves" }
      - { file: sunny-days-between-cubes/board-11-phase-4-all-together.jpg, alt: "Phase 4 board: everything together in one score" }
  - type: text
    heading: Learning from Forsythe
    body: |
      Two sources shaped how the scores were read and animated: William Forsythe's writing on lines, rooms and the mixing of media in dance, and Synchronous Objects, his project with Ohio State University that turns the dance One Flat Thing, reproduced into data visualisations. The images on this board belong to their authors and are shown as research references.
  - type: image
    media: { file: sunny-days-between-cubes/board-12-references.jpg, alt: "References board: Synchronous Objects, with cue visualisers, annotations and motion volumes" }
  - type: text
    heading: Return
    body: |
      The transmedia step closes the loop. The exhibition proposal sits at the centre of the site: each video is shown on the very table where its movements were recorded and scored, so visitors see the bustle of the day replayed as shapes in the place it came from. After dark, LED lights and a projector bring the videos onto the tables, filling the empty courtyard with the movement of the day.
  - type: pair
    tiles: wide
    items:
      - { file: sunny-days-between-cubes/board-13-exhibition.jpg, alt: "Exhibition board: each video returns to its own table" }
      - { file: sunny-days-between-cubes/board-14-at-night.jpg, alt: "At night board: LED light and a projector on the tables" }
  - type: image
    media: { file: sunny-days-between-cubes/board-15-credits.jpg, alt: "Credits board: the hidden rhythm of an ordinary day" }
