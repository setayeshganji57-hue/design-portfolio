blocks:
- type: text
  heading: Explain a service nobody has used yet
  body: |
    Hamloqmeh asks people to try something new: buying good food that a shop didn't sell in time. The website had to introduce that idea to a Persian-speaking audience before the product launches, and answer three questions: what is it, how does it work, and why take part. The goal was to bring customers and businesses onto one waitlist, ahead of wider product testing.

    "Hamloqmeh" means sharing a bite of food with someone, a feeling that has always belonged to the sofreh, hospitality and empathy in Iranian culture. The symbol is built on the Persian letter ه, the first letter of the name: its two counters become two amber circles, two portions side by side.
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-03-the-brief.jpg, alt: "The brief board: three questions the site must answer, for food businesses and for people" }
  - { file: hamloqmeh/board-04-name-mark.jpg, alt: "Name and mark board: the letter \u0647 becomes the symbol, two amber circles in a green block" }
- type: text
  heading: Identity
  body: |
    The mark is simple enough to work as a favicon and an app icon: every part hangs off one centre line, and two equal circles sit in a soft, squircle-like block. Deep bakery greens and an amber like a warm crust present surplus food as good food first, never as a bargain bin. Vazirmatn carries the whole site, drawn for Persian, right to left, with a true Black weight that matches the solid shape of the logo.
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-05-logo-construction.jpg, alt: "Logo construction board: two circles on one centre line, with proportions and sizes" }
  - { file: hamloqmeh/board-06-colour.jpg, alt: "Colour board: forest, Hamloqmeh green, amber, cream, leaf tint and sage" }
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-07-typography.jpg, alt: "Typography board: Vazirmatn, right to left, with the type scale" }
  - { file: hamloqmeh/board-08-structure.jpg, alt: "Structure board: eight pages, one destination, and two journeys into one form" }
- type: text
  heading: The homepage
  body: |
    Eight pages share one destination, the waitlist, with a single persistent button in the header. The homepage is written as an argument, top to bottom: a promise, the problem, how it works, who it is for, who can join, why it matters, common questions, and only then the form.

    The hero makes the promise and previews the product in three stacked cards. How it works fits on one line in three steps, with one card for each audience. Businesses get their own page with four reasons and a four-step process.
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-09-the-homepage.jpg, alt: "The homepage board: one page, one story, in eight sections" }
  - { file: hamloqmeh/board-10-hero.jpg, alt: "Hero board: a promise and a preview, with annotations" }
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-11-how-it-works.jpg, alt: "How it works board: three steps and two audiences" }
  - { file: hamloqmeh/board-12-for-businesses.jpg, alt: "For businesses board: four reasons and a four-step process" }
- type: text
  heading: Dignity before discount
  body: |
    Discounted surplus food can feel like charity, so the copy works against that: it calls the purchase "a smart choice, not a favour", explains prices before anyone asks, and answers doubts openly in a nine-question FAQ. One form serves both audiences: a single contact field for email or mobile, a customer or business switch that reveals one extra field, explicit consent and helpful errors in plain Persian.
- type: pair
  tiles: wide
  items:
  - { file: hamloqmeh/board-13-trust.jpg, alt: "Trust board: values, the FAQ and the line about water, energy and effort" }
  - { file: hamloqmeh/board-14-waitlist.jpg, alt: "Waitlist board: one form for both audiences, with validation" }
- type: text
  heading: In the hand
  body: |
    On a phone, the sections stack in reading order, the steps turn vertical, cards go full width, and the waitlist button stays in the header at every scroll position. The customer app, a separate product, asks people to log in before they can view and reserve food packages.
