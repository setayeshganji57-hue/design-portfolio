blocks:
  - type: text
    heading: Facts
    body: |
      Project type: game design, narrative development, and 3D environment design. Genre: third-person adventure. Year: 2022.
  - type: text
    heading: Reconstructing the historical city
    body: |
      The project began with research into Rome's history, urban fabric, and architectural heritage. The main cartographic reference was Giambattista Nolli's 1748 map of Rome, which provided a foundation for studying the city's historic layout and translating it into a navigable digital environment.

      The environment centres on the Regola district and its architectural context: Santa Maria in Monticelli as the primary building, the surrounding convent buildings, and the garden of Palazzo Spada as a secondary environmental element.

      I modelled every building in the game myself, from start to finish, in Rhinoceros 3D and CAD, studying their facades, proportions, and defining details. The objective was more than a collection of isolated models: the buildings needed to work together as a recognisable place that players could inhabit and explore.
  - type: text
    heading: From architectural models to an interactive world
    body: |
      I imported the buildings into Unreal Engine and built the game environment there, with in-game lighting and third-person navigation.

      The principal characters, Aurelia and Saverio, and a guard character use Unreal Engine mannequins, which I chose and set up in the engine.

      I did all the coding in Unreal Engine, building the gameplay from the story we had written. The city had to work both as a designed visual world and as the setting for play, so the arrangement of buildings, their scale, and the lighting were all used to set the atmosphere and guide the player.
  - type: text
    heading: Storytelling through exploration
    body: |
      At the heart of PERSO is a treasure-hunt narrative structured around discovery and gradual progression.

      Players move through the environment, interact with objects, and collect clues as they get closer to finding Saverio. Collectibles become progressively harder to find, giving the exploration a sense of development and bringing the player closer to the story's resolution.
