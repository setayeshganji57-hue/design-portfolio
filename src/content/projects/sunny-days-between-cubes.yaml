blocks:
  - type: text
    heading: Process and visual exploration
    body: |
      The project began with a site study of the university's covered outdoor resting area. Through observation, photographic documentation, and video recording, I explored the relationship between students' activities, architectural geometry, changing light, and the patterns of movement within the space.
  - type: image
    size: full
    media: { file: sunny-days-between-cubes/site.jpg, alt: Black-and-white photographs of the covered resting area and its tables, fit: contain, background: "#ffffff", caption: "Site study: the covered resting area at Sapienza, its geometry and its light." }
  - type: text
    heading: From movement to score to motion
    body: |
      Drawing inspiration from William Forsythe's choreographic explorations and the Synchronous Objects project, I developed a system of visual scores. Each everyday action was translated into its own graphic expression, then animated. Each row below follows one action from observation, to score, to moving image.
  - type: grid
    columns: 3
    caption: "Writing. The repetitive movement of the hand becomes a zigzag line, which then draws itself across the table in the video."
    items:
      - { file: sunny-days-between-cubes/writing-observed.jpg, alt: Overhead photographs of a student writing at the table, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/writing-score.jpg, alt: Red zigzag line, the score for writing, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/writing-motion.jpg, alt: Video frames of a red line drawing across the grey table, fit: contain, background: "#ffffff" }
  - type: grid
    columns: 3
    caption: "Typing. Keystrokes are abstracted into modular squares, which multiply across the surface in the video."
    items:
      - { file: sunny-days-between-cubes/typing-observed.jpg, alt: Overhead photographs of a student typing on a laptop, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/typing-score.jpg, alt: Grid of red squares, the score for typing, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/typing-motion.jpg, alt: Video frames of red squares spreading across the table, fit: contain, background: "#ffffff" }
  - type: grid
    columns: 3
    caption: "Conversation. Speech is represented by circles and sound-wave forms, which drift and gather in the video."
    items:
      - { file: sunny-days-between-cubes/conversation-observed.jpg, alt: Overhead photographs of students talking around the table, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/conversation-score.jpg, alt: Red sound-wave form, the score for conversation, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/conversation-motion.jpg, alt: Video frames of circles and spheres gathering on the table, fit: contain, background: "#ffffff" }
  - type: pair
    align: center
    caption: "Combined composition. The three scores coexist, and lines, grids and waveforms become one abstract visual environment."
    items:
      - { file: sunny-days-between-cubes/combined-scores.jpg, alt: The zigzag line, sound wave and square grid together, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/combined-motion.jpg, alt: Frame of the combined video with red squares and waves on the table, fit: contain, background: "#000000" }
  - type: text
    heading: From screen to space — exhibition concept
    body: |
      The final stage extended the research beyond the screen into a site-specific exhibition design concept. Using projected imagery and LED lighting, the proposal reimagines the university's central resting area as an immersive visual experience, placing the generated forms back into the space that inspired them.

      The installation concept establishes a dialogue between the physical environment and its abstract representation, allowing the familiar rhythms of student life to be perceived in a different way. This is a proposal: the presentation documents the concept, not a realised installation.
  - type: pair
    align: center
    caption: "Installation proposal: the plan of the projection area, and a visualisation of the projector over the tables at night."
    items:
      - { file: sunny-days-between-cubes/exhibition-plan.jpg, alt: Exhibition design plan with the table layout and projection frames, fit: contain, background: "#ffffff" }
      - { file: sunny-days-between-cubes/installation.jpg, alt: Night visualisation of a projector beam over the tables in the resting area, fit: contain, background: "#000000" }
  - type: text
    heading: Outcome
    body: |
      Sunny Days Between Cubes explores how observation can become notation, notation can become moving imagery, and moving imagery can become a spatial experience. By connecting research, abstraction, motion, and exhibition design, the project examines the potential of visual communication to make the invisible patterns of everyday life visible.
