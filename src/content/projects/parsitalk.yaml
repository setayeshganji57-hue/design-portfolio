summary: A web app that teaches Persian through stories, voice, calligraphy and culture, for Iranian children growing up abroad and anyone drawn to the language.
overview: |
  ParsiTalk is a web app that teaches Persian through stories, voice, calligraphy and culture, designed for Iranian children growing up abroad and for anyone drawn to the language. Many children of Iranian families grow up hearing Persian at home but rarely reading, writing or speaking it with confidence, and vocabulary drills don't give them a reason to care.

  ParsiTalk teaches Persian through the things that make it worth learning: stories set in real Iranian cities, festivals like Nowruz and Yalda, poetry by Hafez and Rumi, family words and food. Every lesson is wrapped in culture, and every new word can be heard, spoken and written. I worked from the concept through the UX flows, the UI system and an interactive prototype built with v0 by Vercel.

  Project stage: early-stage startup, with a live interactive prototype.
