blocks:
  - type: text
    heading: "Lesson 1: Preproduction, from process to outcome (11 April 2022)"
    body: |
      This lesson takes students through preproduction: the steps that turn an idea into a plan before any animation is made.

      Preproduction phases: a timeline from concept development, keywords and mind maps, script outline and visual concept, to storyboard, design board and pitch.

      Visual style: the choices that define a project's look, including colour palette, medium, line quality, scale, texture, typography and cinematic conventions.

      Storyboarding: what a storyboard is, its main elements (camera field, angle and movement, character movement, sound and dialogue, duration), and traditional versus thumbnail storyboards.

      Camera language: each type of shot, shooting angle and camera movement, from the extreme wide shot to the bird's-eye view, the dolly, the pan and the tilt, each explained beside a drawn example.

      Design boards and pitch books: how a design board fixes the visual style of a motion project, how it differs from a storyboard, and how to present the work.
