summary: A historical mystery told through photography. A narrative adventure game concept set in a distorted, snow-covered Rome.
overview: |
  What if a photograph could transport you into a forgotten version of history?

  ChronoLens is a narrative-driven adventure game concept that transforms the historic city of Rome into an atmospheric mystery to be uncovered. The story follows Nerezza, a young history student who discovers an old camera in an antique shop. After taking a photograph, she finds herself in a distorted, snow-covered version of Rome, where familiar landmarks conceal the traces of a forgotten crime.

  Through exploration, observation, and the collection of photographic clues, players piece together the circumstances surrounding a photographer's mysterious death. At the heart of the experience lies the Pantheon, a landmark that becomes both a historical anchor and a key element in the unfolding narrative.
