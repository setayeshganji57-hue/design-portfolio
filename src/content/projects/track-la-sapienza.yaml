summary: A map-based interface for the Sapienza University website, using shapes to help visitors find buildings.
overview: |
  A user interface for the Sapienza University website, showing the buildings of the campus area on an interactive map. Each building type has its own geometric form on the map, so visitors can recognise it at a glance.

  Libraries are circles, campuses are rectangles, and canteens (mensa) are triangles. The system helps visitors on the site and on the ground to see where they are and where they need to go.
