blocks:
  - type: text
    heading: One line, two scripts
    body: |
      LANDO and لاندو are drawn, not typed. Both are built from the same rounded monoline, an even stroke, soft terminals and an open inner channel, so the two names carry the same weight and neither reads as a translation of the other. The O of the Latin name is drawn as a round maze, the partner of the monogram, an L inside a speech bubble that travels where the full name has no room: onto seals, stamps, ribbons and the corner of every box.
