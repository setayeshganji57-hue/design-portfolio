      - { file: social-cafe/board-10-icons.jpg, alt: "Every icon sits at the table board: menu icons and hang tags" }
  - type: pair
    tiles: wide
    items:
      - { file: social-cafe/board-11-stickers.jpg, alt: "Round seals for everything board: stickers in three colours" }
      - { file: social-cafe/board-12-voice.jpg, alt: "Talking like a friend at the table board: the stacked logotype and the caf\u00e9's lines" }
  - type: text
    heading: In the café
    body: |
      Menus are framed in the table's arched shape, with Persian headings and prices in the brand's colours, and small folded price cards stand next to each pastry. Cups wear sleeves in cream, terracotta and blue; takeaway bags and coffee pouches carry the logotype and the pattern; business cards come in all three colours. In the space itself the mark is a blue sign on the shopfront, the table's rounded end becomes the door, and the logo sits on the staff's uniforms and bandanas.
