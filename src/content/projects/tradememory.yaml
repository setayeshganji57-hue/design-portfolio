title: TradeMemory
status: published
categories: [digital-ui]
order: 20
tags: [Product concept, UI design, Analytics, Trading journal]
summary: A trading journal that helps traders understand their decisions and performance.
overview: |
  A trading journal designed to help traders understand their decisions and performance. I developed the product concept and designed interfaces for trade logging, review, and analytics, drawing on my own experience as a trader.

  The app is in private beta, as its homepage states. The site describes its analysis as historical only, not trading signals or financial advice.
role: Product Concept, Visual Design & UI Design
development: AI-assisted development. Concept and interface design by Setayesh Ganji.
