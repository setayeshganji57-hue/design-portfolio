summary: Four vertical motion films for Zameen Art House in Vancouver, animating the identity's circle, stroke and diamond in sand, sage and Pacific blue.
overview: |
  Four motion graphic films for Zameen Art House, an art house in Vancouver whose identity I also designed. Zameen (زمین) means "earth" in Persian, and the logo writes the word with only three shapes: a circle for the earth, a long stroke from the keshideh of Persian script that becomes a horizon line, and a diamond from the calligraphic dot that becomes a seed.

  The films set that kit in motion: circles, diamonds, arcs and fine construction lines, in the identity's earth sand, sage green and Pacific blue. Made in a vertical 9:16 format, each film is short, between twelve and thirty-seven seconds, so the identity moves the way it is seen most: on a phone, one piece at a time.
role: Motion design and animation, based on the brand identity I designed
