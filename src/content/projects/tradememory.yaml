- type: text
  heading: Screen by screen
  body: |
    Each board annotates one screen with example data: what it does, what works, and what the next iteration should change. Together they form an audit of the shipped product.

    Getting in and setting up: the landing page makes one honest promise, and a new account states its rules, timezones and pip size, before any number is trusted.
- type: pair
  tiles: wide
  items:
  - { file: tradememory/board-06-landing-access.jpg, alt: "Landing and access board: one screen, one honest promise" }
  - { file: tradememory/board-07-account-setup.jpg, alt: "Account setup board: set the rules once, trust every number" }
- type: text
  heading: Import, overview and calendar
  body: |
    Import is the signature screen: three reconciliation checks, each with a plain-language proof, and Confirm stays disabled until every one passes. The Overview answers where am I and what's next, and the Calendar shows a month of trading days with review progress beside the money.
- type: pair
  tiles: wide
  items:
  - { file: tradememory/board-08-import-verify.jpg, alt: "Import and verify board: trust before insight, made visible" }
  - { file: tradememory/board-09-overview.jpg, alt: "Overview board: where am I, what's next" }
- type: image
  media: { file: tradememory/board-10-calendar.jpg, alt: "Calendar board: a month of trading days" }
- type: text
  heading: Trades and review
  body: |
    MT5 records deals, not trades, so TradeMemory rebuilds each position from its deals. The trade detail separates the broker's facts from the trader's journal, so a note can never be mistaken for a fact. The Review Queue treats journaling as an inbox, one trade at a time, with every term defined and its unit stated.
- type: pair
  tiles: wide
  items:
  - { file: tradememory/board-11-trades.jpg, alt: "Trades board: every trade, rebuilt from deals" }
  - { file: tradememory/board-12-trade-detail.jpg, alt: "Trade detail board: what happened beside what I meant" }
- type: image
  media: { file: tradememory/board-13-review-queue.jpg, alt: "Review Queue board: journaling as an inbox" }
- type: text
  heading: Insights, analysis and mobile
  body: |
    Insights is designed as a mirror, not a crystal ball: every chart names its population, every value shows its sample size, and the app refuses to conclude from too little data. Statement analysis is the deepest page, and the audit proposes moving its conclusions to the top. On a phone, the same navigation becomes four tabs and More, and the light theme's contrast is checked by a unit test.
- type: pair
  tiles: wide
  items:
  - { file: tradememory/board-14-insights.jpg, alt: "Insights board: a mirror, not a crystal ball" }
  - { file: tradememory/board-15-statement-analysis.jpg, alt: "Statement analysis board: the deepest page, the longest scroll" }
- type: image
  media: { file: tradememory/board-16-responsive-themes.jpg, alt: "Responsive and themes board: mobile screens and the light theme" }
- type: text
  heading: Roadmap
  body: |
    Phase one is what ships today in the private beta. Phases two and three come from the screen-by-screen audit, and each item points back to a board: first polish and consistency, then clarity and bringing the product closer to the brand. The success signal is simple: an activated tester has imported a statement and journaled at least five trades.
- type: image
  media: { file: tradememory/board-17-ui-ux-roadmap.jpg, alt: "UI and UX roadmap in three phases: shipped, next and later" }
- type: text
  heading: Designing for trust
  body: |
    Trading data is personal and easy to misread, so the interface is explicit about what it knows. Imports must be confirmed before they count. Every metric shows the number of trades behind it. Results are labelled as realised and assigned to a clear date. Read-only fields explain themselves. The aim is a tool that helps traders reflect honestly on their decisions rather than one that flatters them with numbers.
