  - type: text
    heading: Animating the kit
    body: |
      The identity was designed to be built from parts, solid circles, strokes and diamonds over a second layer of hairline guides, so it already behaves like a set of pieces that can move. In motion, the rules stay the same as in print: one idea per film, at least half of every frame left empty, and only the three colours of the system.

      The logo's long stroke is the clearest example. On Instagram it stretches across three posts, the nun on the first, the line through the second and the rest of the word on the third, so the word زمین only appears when the grid is seen whole. The films carry the same idea from a still grid into time.
