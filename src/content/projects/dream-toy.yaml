summary: Identity, original illustrations, and website interface design for a cryptocurrency-based fundraising startup.
overview: 'Drymto was conceived as a cryptocurrency-based fundraising platform, connecting people seeking support for their ideas with potential contributors. Its name combines “dream” and “crypto,” bringing personal ambition into the identity of a technology-led service.


  I designed the brand identity, original illustrations, and website interface. The logo draws on the form of a phoenix, interpreted within the project as a symbol of dreaming and aspiration. A gold-and-blue palette connects the mark with an illustrated world of people, growth, and possibility.


  The design challenge was to give a technically unfamiliar service an approachable visual language while organising the steps involved in fundraising. I extended the identity across the homepage, registration screens, donation interface, and a sequence for creating a fundraiser—from choosing a beneficiary and setting a target to telling a story and submitting it for review.


  Alongside the visual design, I mapped the website’s pages and proposed journeys, connecting the brand experience with the structure of the product.


  Work shown: Identity assets and website design-stage mockups, including placeholder content from the original project.'
role: Brand identity, logo design, original illustration, website UI design, wireframes, and user-flow mapping.
