summary: Lesson materials I designed as a teaching assistant for Sapienza's Multimedia Design Studio, on preproduction and stop-motion animation.
overview: |
  I was invited to Sapienza University of Rome as a teaching assistant in the Multimedia Design Studio, led by Prof. Vincenzo Maselli, to teach parts of the motion design programme. For each lesson I designed the teaching materials.

  The lessons below cover two stages of a motion project: planning it, and one of the oldest ways of making it move.
