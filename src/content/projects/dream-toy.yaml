blocks:
- type: text
  heading: A phoenix for every dream
  body: |
    The mark is a phoenix drawn from one circle: a single S-curve running tip to tip carves the neck and the raised head, and a thin tapered echo follows the cut like a trailing feather. Gold carries value and every call to action; cobalt is the dream-world of the illustrations; charcoal sets the text and a soft mist grey keeps the screens calm. One bilingual type family, Yekan Bakh, sets both versions of the product: the Persian wireframes and the English interface.
