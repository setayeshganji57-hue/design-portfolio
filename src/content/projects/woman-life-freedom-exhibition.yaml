summary: An exhibition area designed as a 3D space, reflecting on the 2022 "Woman, Life, Freedom" movement in Iran.
overview: 'An exhibition area reflecting on the "Woman, Life, Freedom" movement in Iran that began in October 2022. The concept combines this theme with "Zoorkhane", a traditional Iranian gymnasium.


  The project covers the whole process: choosing the location, selecting materials, defining dimensions, and the 3D design of the structure.

  '
