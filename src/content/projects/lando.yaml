      - { file: lando/board-10-small-print.jpg, alt: "Small print board: stickers, seals and gift tags" }
  - type: text
    heading: On the counter
    body: |
      Pink and mint swap roles from one box to the next, a pink lid on a mint base, then the reverse, in five formats for cookies, pastries and cakes, each lined inside with the brand stripes. Takeaway pieces use the identity at its simplest: a pink paper bag with the stacked wordmark, a mint pouch, bread sleeves printed with the lettering and the bubble pattern, and a slim sliding box for macarons tied with a ribbon. The Instagram grid introduced the identity piece by piece, and one post is the opening invitation itself: Lando invites you to the opening at 18:00 on 5 Tir 1403 (25 June 2024).
